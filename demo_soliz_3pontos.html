/* reduz a fotografia a 700 x 700: recorte quadrado central e reescala */
function preparaImagem(img, L) {

  var sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
  var c = document.createElement('canvas'); c.width = c.height = L;
  var g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, sx, sy, lado, lado, 0, 0, L, L);
  return { canvas: c, ctx: g, dados: g.getImageData(0, 0, L, L), lado: lado };
}

/* desenha a foto e por cima o contorno da máscara */
function pinta(cv, base, m, L, cor) {
  var g = cv.getContext('2d');
  g.putImageData(base, 0, 0);
  if (!m) return;
  var im = g.getImageData(0, 0, L, L), d = im.data, x, y, k;
  for (y = 0; y &lt; L; y++) for (x = 0; x &lt; L; x++) {
    k = y * L + x;
    if (!m[k]) continue;
    var borda = (x === 0 || y === 0 || x === L - 1 || y === L - 1 ||

           d[j + 2] = d[j + 2] * 0.78 + cor[2] * 0.22; }

}

    { minimumFractionDigits: casas, maximumFractionDigits: casas });

document.getElementById('arq').onchange = function (ev) {

grafia clínica</strong>. No único banco humano testado (ComplexWoundDB, 27 imagens) ele não transferiu. O que você vê aqui é demonstração de um mecanismo, não uma medida clínica.",rodar:"Rodar",rodando:"Rodando…",comb:"combinação",lac:"1 · Laço",lac_h:"Arraste em volta da lesão e solte para fechar.",cls_b:"2 · Borda",cls_l:"3 · Lesão",cls_p:"4 · Pele",cls_h:"Clique em quatro lugares diferentes para cada classe.",limpar:"Limpar",lado:"Margem: FORA · travada nesta demo",res:"Resultado",sem:"MEDIDA RECUSADA",sem_h:"Nenhum dos oito maiores componentes da faixa de transição toca ao mesmo tempo o interior e o exterior. O anel não fechou, e o método não entrega número quando isso acontece.",r_area:"Área",r_nota:"Nota",r_aj:"Ajuste escolhido",r_px:"pixels",r_mm:"mm² · escala declarada por você",r_uni:"unidade",r_fino:"finura",r_comp:"compacidade",r_tam:"tamanho",r_ilhas:"Ilhas: só o maior componente foi mantido.",r_desc:"descartados em ilhas menores",r_def:"A escala digitada vale para a sua fotografia; o motor trabalha num quadro de 700 × 700. A demo converte a escala e ajusta o diâmetro pela mesma identidade algébrica da reauditoria de 28/09 — o motor continua intocado, com 30 px/mm fixos por dentro.",ver:"Ver código-fonte legível",esc_h:"Precisa marcar as três classes antes de rodar.",voltar:"← Voltar",f_t:"O que esta página é, e o que ela não é",f1:"<strong>Implementação JavaScript equivalente.</strong> As medidas do artigo <strong>não</strong> vêm daqui: vêm do motor Python v0 registrado (BR 51 2026 008413-0). Esta página reimplementa a mesma regra para que ela possa ser vista funcionando.",f1b:"<strong>Porte validado contra o motor congelado:</strong> idêntico em 64/64 amostras e na escolha da grade completa (n = 81.458; nota 0,861474), e idêntico também sobre uma imagem real do artigo — a 1323·C do held-out do dia 3 — quando recebe exatamente os mesmos pixels: 61.945 px, 275,4 mm², nota 0,5231, mesmo ajuste. <strong>Esta página reproduz os números publicados quando recebe a mesma entrada.</strong> Quando ela mesma reduz a fotografia a 700 × 700, aparece uma diferença de cerca de 1 % — <strong>de reamostragem de imagem, não de motor</strong>: o <code>drawImage</code> do navegador e o LANCZOS do PIL não dão os mesmos pixels. Tudo em <code>VALIDACAO_PORTE_JS_30SET.md</code>, SHA-256 <code>12af713de1fdc32ef409f8638e65b452c37da1c97b4865893037c9fbb3783761</code>.",f1c:"As três divergências conhecidas abaixo referem-se à <strong>bancada v106</strong> usada no desenvolvimento (S3) e <strong>não se aplicam a esta implementação</strong>. A quarta permanece, de propósito.",f2:"Patente depositada: <strong>BR 10 2026 024571 2</strong>.",f3:"Fonte da regra: <code>06_MOTOR_DE_REGISTRO\\v0_congelado_2026-09-22\\rodar.py</code>, SHA-256 <code>78b193014577a45109771a2b15f3b7ff55663b0bb4312a23980c766fe7161732</code>, dentro de <code>MOTOR_v0_congelado.zip</code>, SHA-256 <code>03ce6b7f7391a113714106af62b7c7865a6558cc84b8a13622c1cad47b0d27ee</code>.",f_div:"Divergências conhecidas entre a bancada em JavaScript e o motor Python",f_div_h:"As três primeiras estão copiadas palavra por palavra de <code>v0_congelado_2026-09-22\\_LEIA.md</code>, seção “O QUE JÁ SE SABE QUE ESTÁ ERRADO”, onde foram apontadas em 22/09/2026. A quarta é desta demonstração.",d1:"<strong>O conta-gotas da bancada pinta sobre o mapa, não sobre a foto.</strong> Este motor pinta sobre a foto.",d2:"<strong>A área da bancada sai de um polígono de 30 pontos</strong>, não da máscara de pixels. Este motor conta pixels.",d3:"<strong>Quando o anel falha, a bancada cai em silêncio para Otsu.</strong> Este motor devolve falha.",d4:"<strong>Nisto a demo difere da bancada de desenvolvimento, de propósito:</strong> aqui, anel que não fecha é medida recusada, como no motor registrado.",f_uso:"Uso em bancos de terceiros",f_uso_p:"Ninguém roda esta demonstração em <strong>FUSeg, AZH, DFUC, Medetec ou UNESP</strong> sem pré-registro publicado.",f_hash:"SHA-256 do JavaScript desta página",f_hash_h:"Calculado na montagem. Para conferir, extraia o conteúdo da tag <code>&lt;script&gt;</code> principal e rode:",f_doi:"Preprint: <a href=https://doi.org/10.5281/zenodo.23062849 target=_blank>doi:10.5281/zenodo.23062849</a>",f_arq:"Hash dos arquivos da demonstração",f_arq_h:"O hash do próprio <code>index.html</code> está em <code>_HASHES.txt</code>, na mesma pasta — uma página não consegue conter o seu próprio hash."},en:{lang:"EN",outra:"PT",marca:"De Olho na Pele · SoLiz",idx_t:"The ring rule, running in your browser",idx_p:"This demonstration runs the study’s edge rule — the same one transcribed step by step in Supplement S3 — on a photograph you choose. Everything happens inside the browser: <strong>the image never leaves your computer</strong>, there is no server and nothing is uploaded. Two modes: <strong>automatic</strong>, in which the machine sweeps 144 parameter combinations and picks one on its own; and <strong>assisted</strong>, in which you mark three colour classes with the mouse and the machine classifies what is inside the lasso.",b_auto:"Automatic",b_3p:"Three Dots",b_auto_s:"the machine decides alone, 144 combinations",b_3p_s:"you mark edge, lesion and skin; the machine classifies",auto_t:"Automatic mode",auto_p:"Choose a photograph. The machine reduces the frame to 700 × 700, sweeps the 144 combinations of the grid and keeps the highest-scoring one. No human reference enters the choice.",p3_t:"Assisted mode · three dots",p3_p:"Choose a photograph, enclose the lesion with the lasso and mark three colour classes: <strong>edge</strong>, <strong>lesion</strong> and <strong>skin</strong>. Repeat at four different places. Every pixel inside the lasso goes to the class of smallest normalised CIE Lab distance.",esc:"Choose photograph",nada:"No file chosen",priv:"The image stays in the browser. Nothing is uploaded.",diam:"Declared diameter (mm)",diam_h:"It enters the size term of the score. It is <em>your declaration</em>, not a measurement.",esca:"Scale (px
